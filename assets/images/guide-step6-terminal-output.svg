<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowGreen6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg6)" stroke="#1e293b" stroke-width="4" filter="url(#shadow6)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#080c14"/>

  <!-- Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:14</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- Top Editor Part (Slightly compressed behind sliding terminal) -->
  <rect x="16" y="54" width="348" height="46" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="82" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">Code Editor — main.cpp</text>

  <!-- Code snippet in background -->
  <g transform="translate(24, 110)" font-family="monospace" font-size="11" opacity="0.6">
    <text x="0" y="14" fill="#818cf8">cout &lt;&lt; "Pehla number dal: ";</text>
    <text x="0" y="32" fill="#818cf8">cin &gt;&gt; a;</text>
    <text x="0" y="50" fill="#818cf8">cout &lt;&lt; "Jod = " &lt;&lt; a + b;</text>
  </g>

  <!-- SLIDING TERMINAL DRAWER (FULL HEIGHT) -->
  <g transform="translate(16, 175)" filter="url(#shadow6)">
    <rect x="0" y="0" width="348" height="490" rx="20" fill="#050811" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="348" height="42" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Green status pulse dot -->
    <circle cx="24" cy="21" r="5" fill="#10b981" filter="url(#glowGreen6)"/>
    <text x="36" y="25" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">TERMINAL</text>

    <!-- Clear & Close Buttons -->
    <rect x="235" y="10" width="55" height="24" rx="5" fill="#1e293b"/>
    <text x="245" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">CLEAR</text>

    <text x="312" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">✕</text>

    <!-- Terminal Output Content (Real Clang compilation & interactive execution) -->
    <g transform="translate(18, 52)" font-family="monospace" font-size="11">
      <!-- Command -->
      <text x="0" y="18" fill="#10b981">$ cd "/home/projects/CppStarter" &amp;&amp;</text>
      <text x="0" y="34" fill="#10b981">  clang++ -std=c++17 main.cpp -o main.out</text>
      
      <!-- Compilation Success -->
      <text x="0" y="56" fill="#64748b">==&gt; Compilation clean (0 warnings)</text>
      
      <!-- Execution -->
      <text x="0" y="76" fill="#38bdf8">$ ./main.out</text>
      
      <!-- Program I/O -->
      <text x="0" y="102" fill="#cbd5e1">Pehla number dal: <tspan fill="#facc15" font-weight="bold">10</tspan></text>
      <text x="0" y="124" fill="#cbd5e1">Dusra number dal: <tspan fill="#facc15" font-weight="bold">20</tspan></text>
      
      <rect x="0" y="136" width="312" height="34" rx="8" fill="#13271f" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="158" fill="#34d399" font-weight="bold" font-size="12.5">Jod = 30</text>

      <text x="0" y="196" fill="#64748b">[Process finished with exit code 0]</text>
    </g>

    <!-- INTERACTIVE INPUT BAR AT BOTTOM OF TERMINAL -->
    <g transform="translate(16, 420)">
      <rect x="0" y="0" width="316" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="27" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">$</text>
      <text x="32" y="26" fill="#94a3b8" font-family="monospace" font-size="12">Type command or input...</text>
      
      <!-- Send Button (Green ▶) -->
      <rect x="274" y="8" width="30" height="28" rx="6" fill="#10b981"/>
      <polygon points="284,15 284,29 295,22" fill="#ffffff"/>
    </g>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
