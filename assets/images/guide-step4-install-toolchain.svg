<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg4)" stroke="#1e293b" stroke-width="4" filter="url(#shadow4)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#080c14"/>

  <!-- Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:11</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- App Header -->
  <rect x="16" y="54" width="348" height="52" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="85" fill="#f8fafc" font-family="-apple-system, Roboto, sans-serif" font-size="15" font-weight="700">Compiler Setup Guide</text>

  <!-- SECTION 1: IN-APP LANGUAGE TOOLCHAIN CARDS -->
  <g transform="translate(30, 116)" filter="url(#shadow4)">
    <rect x="0" y="0" width="320" height="220" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Header in Guide -->
    <text x="20" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">1-TAP COMPILER INSTALLER</text>

    <!-- Language Row 1: Clang / C++ -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="288" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="8" y="10" width="28" height="28" rx="6" fill="#2563eb"/>
      <text x="14" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">C</text>
      <text x="44" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">C / C++ (Clang)</text>
      <text x="44" y="38" fill="#94a3b8" font-family="monospace" font-size="10">main.cpp • pkg install clang</text>
      
      <rect x="216" y="10" width="64" height="28" rx="6" fill="#10b981"/>
      <text x="226" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">✓ Ready</text>
    </g>

    <!-- Language Row 2: Rust (CLICK TARGET) -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="288" height="48" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="8" y="10" width="28" height="28" rx="6" fill="#ea580c"/>
      <text x="14" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">R</text>
      <text x="44" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Rust &amp; Cargo</text>
      <text x="44" y="38" fill="#94a3b8" font-family="monospace" font-size="10">main.rs • LLVM backend</text>
      
      <rect x="216" y="10" width="64" height="28" rx="6" fill="#4f46e5"/>
      <text x="226" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Install</text>
    </g>

    <!-- Language Row 3: Python 3 -->
    <g transform="translate(16, 152)">
      <rect x="0" y="0" width="288" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="8" y="10" width="28" height="28" rx="6" fill="#ca8a04"/>
      <text x="14" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">Py</text>
      <text x="44" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Python 3 &amp; Pip</text>
      <text x="44" y="38" fill="#94a3b8" font-family="monospace" font-size="10">main.py • pkg install python</text>
      
      <rect x="216" y="10" width="64" height="28" rx="6" fill="#1e293b"/>
      <text x="226" y="28" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Install</text>
    </g>
  </g>

  <!-- RED ARROW POINTING TO "Install" ON RUST -->
  <g filter="url(#glowRed4)">
    <circle cx="278" cy="226" r="14" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M330 226 L298 226" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <polygon points="300,221 292,226 300,231" fill="#f43f5e"/>
  </g>

  <!-- SECTION 2: LIVE TERMINAL PACKAGE INSTALLATION VIEW -->
  <g transform="translate(30, 355)" filter="url(#shadow4)">
    <rect x="0" y="0" width="320" height="290" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Terminal Titlebar -->
    <rect x="0" y="0" width="320" height="34" rx="16" fill="#111827"/>
    <circle cx="18" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="17" r="4.5" fill="#eab308"/>
    <circle cx="46" cy="17" r="4.5" fill="#22c55e"/>
    <text x="64" y="21" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">terminal — bash</text>

    <!-- Terminal Output Text -->
    <g transform="translate(16, 44)" font-family="monospace" font-size="10.5">
      <text x="0" y="14" fill="#10b981">$ pkg install rust</text>
      <text x="0" y="34" fill="#38bdf8">==&gt; TermCode Package Manager</text>
      <text x="0" y="52" fill="#cbd5e1">Connecting to TermCode GitHub CDN...</text>
      <text x="0" y="70" fill="#cbd5e1">Downloading rustc-1.78.0-aarch64...</text>
      
      <!-- Mini Progress in Terminal -->
      <rect x="0" y="82" width="288" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="82" width="288" height="6" rx="3" fill="#38bdf8"/>
      <text x="0" y="104" fill="#34d399">100% Download complete (42.5 MB)</text>
      <text x="0" y="122" fill="#cbd5e1">Extracting toolchain into /usr/bin/...</text>
      <text x="0" y="142" fill="#10b981">✓ Rust Compiler &amp; Cargo Installed!</text>
      <text x="0" y="166" fill="#94a3b8">$ rustc --version</text>
      <text x="0" y="184" fill="#f8fafc">rustc 1.78.0 (9b00956e5 2024-05-03)</text>
      <text x="0" y="210" fill="#38bdf8">$ <tspan fill="#ffffff" opacity="0.8">_</tspan></text>
    </g>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
