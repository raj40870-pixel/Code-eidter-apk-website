<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shadow2b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowRed2b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff0055" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg2b)" stroke="#1e293b" stroke-width="4" filter="url(#shadow2b)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#0d111a"/>

  <!-- Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:09</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- App Header -->
  <rect x="16" y="54" width="348" height="54" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="86" fill="#f8fafc" font-family="-apple-system, Roboto, sans-serif" font-size="15" font-weight="700">Code Editor</text>

  <!-- Left Explorer Drawer Background -->
  <rect x="16" y="108" width="285" height="558" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Explorer Header -->
  <rect x="16" y="108" width="285" height="46" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="137" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">EXPLORER</text>
  
  <!-- Three dots icon target button -->
  <rect x="264" y="117" width="28" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="278" cy="126" r="2.5" fill="#ffffff"/>
  <circle cx="278" cy="131" r="2.5" fill="#ffffff"/>
  <circle cx="278" cy="136" r="2.5" fill="#ffffff"/>

  <!-- Underlying files -->
  <g transform="translate(30, 160)" opacity="0.35">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="11">CPPSTARTER</text>
    <text x="24" y="42" fill="#e2e8f0" font-family="monospace" font-size="13">main.cpp</text>
    <text x="24" y="74" fill="#94a3b8" font-family="monospace" font-size="13">index.html</text>
    <text x="24" y="106" fill="#94a3b8" font-family="monospace" font-size="13">main.rs</text>
  </g>

  <!-- REAL POPUP DROPDOWN MENU -->
  <g transform="translate(85, 148)" filter="url(#shadow2b)">
    <rect x="0" y="0" width="265" height="290" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Option 1: Open Terminal -->
    <text x="18" y="32" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13.5">&gt;_ Open Terminal</text>

    <!-- Option 2: Install Linux Environment (CLICK TARGET) -->
    <rect x="6" y="46" width="253" height="42" rx="8" fill="#312e81" stroke="#ff0055" stroke-width="2"/>
    <text x="18" y="72" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">⚡ Install Linux Environment</text>

    <!-- Option 3: Editor Settings -->
    <text x="18" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13.5">⚙️ Editor Settings</text>

    <!-- Option 4: Compiler Setup Guide -->
    <text x="18" y="154" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13.5">🛠️ Compiler Setup Guide</text>

    <!-- Option 5: Licenses & Credits -->
    <text x="18" y="194" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13.5">📜 Licenses &amp; Credits</text>

    <!-- Option 6: About Code Editor -->
    <text x="18" y="234" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13.5">ℹ️ About Code Editor</text>

    <!-- Option 7: Reset to CppStarter -->
    <text x="18" y="270" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13.5">🏠 Reset to CppStarter</text>
  </g>

  <!-- BOLD RED ARROW 1: Pointing to Three Dots (⋮) -->
  <g filter="url(#glowRed2b)">
    <circle cx="278" cy="131" r="16" fill="none" stroke="#ff0055" stroke-width="2.5" stroke-dasharray="4,3"/>
    
    <path d="M330 90 L288 120" fill="none" stroke="#ff0055" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="295,115 282,125 289,127" fill="#ff0055"/>

    <rect x="220" y="58" width="135" height="30" rx="6" fill="#ff0055" stroke="#ffffff" stroke-width="1.5"/>
    <text x="228" y="78" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="900">1. TAP 3-DOTS (⋮)</text>
  </g>

  <!-- BOLD RED ARROW 2: Pointing to "Install Linux Environment" -->
  <g filter="url(#glowRed2b)">
    <!-- Arrow from bottom left -->
    <path d="M35 240 L88 205" fill="none" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>
    <polygon points="86,198 96,200 90,210" fill="#ff0055"/>

    <!-- Callout Box -->
    <rect x="20" y="240" width="220" height="52" rx="10" fill="#ff0055" stroke="#ffffff" stroke-width="2"/>
    <text x="32" y="262" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">2. TAP "INSTALL LINUX"</text>
    <text x="32" y="280" fill="#ffe4e6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Sets up Termux Linux &amp; Tools</text>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
