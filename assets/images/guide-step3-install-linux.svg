<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg3b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="progGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow3b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowRed3b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff0055" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg3b)" stroke="#1e293b" stroke-width="4" filter="url(#shadow3b)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#080c14"/>

  <!-- Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:10</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- Background dim layer -->
  <rect x="16" y="54" width="348" height="612" fill="#000000" opacity="0.7"/>

  <!-- CARD 1: CONFIRMATION ALERT DIALOG -->
  <g transform="translate(30, 75)" filter="url(#shadow3b)">
    <rect x="0" y="0" width="320" height="235" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <text x="24" y="36" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16.5" font-weight="800">⚡ Install Termux Linux</text>
    
    <text x="24" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500">Install embedded Linux package system (~31 MB)?</text>
    
    <text x="24" y="96" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Installs bash, apt &amp; pkg package manager</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Offline compilers: Clang, Python, Node.js</text>
    <text x="24" y="140" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• 100% rootless inside app environment</text>

    <!-- Dialog Buttons -->
    <text x="135" y="200" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Cancel</text>
    
    <!-- INSTALL NOW BUTTON -->
    <rect x="195" y="174" width="110" height="42" rx="10" fill="#4f46e5" stroke="#ff0055" stroke-width="2"/>
    <text x="210" y="200" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">Install Now</text>
  </g>

  <!-- RED POINTER ARROW POINTING TO "Install Now" -->
  <g filter="url(#glowRed3b)">
    <circle cx="250" cy="195" r="22" fill="none" stroke="#ff0055" stroke-width="2.5" stroke-dasharray="4,3"/>
    
    <path d="M250 256 L250 220" fill="none" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>
    <polygon points="244,222 256,222 250,212" fill="#ff0055"/>
    
    <rect x="125" y="256" width="195" height="34" rx="8" fill="#ff0055" stroke="#ffffff" stroke-width="1.5"/>
    <text x="138" y="278" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">CLICK 3: TAP "INSTALL NOW"</text>
  </g>

  <!-- CARD 2: INSTALLATION IN PROGRESS -->
  <g transform="translate(30, 345)" filter="url(#shadow3b)">
    <rect x="0" y="0" width="320" height="175" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <text x="24" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Installing Termux Linux...</text>
    
    <text x="24" y="68" fill="#38bdf8" font-family="monospace" font-size="12.5" font-weight="600">Extracting bootstrap rootfs (78%)...</text>

    <!-- Progress Track & Bar -->
    <rect x="24" y="86" width="272" height="12" rx="6" fill="#0f172a"/>
    <rect x="24" y="86" width="212" height="12" rx="6" fill="url(#progGrad3)"/>

    <text x="24" y="128" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Automated one-time setup • Takes ~15 seconds</text>
    <text x="250" y="128" fill="#10b981" font-family="monospace" font-size="13" font-weight="800">78%</text>

    <!-- Progress animated pulse indicator -->
    <rect x="24" y="142" width="150" height="20" rx="4" fill="#0f172a"/>
    <text x="30" y="156" fill="#a5b4fc" font-family="monospace" font-size="10">Status: In Progress...</text>
  </g>

  <!-- SUCCESS TOAST MESSAGE -->
  <g transform="translate(35, 555)" filter="url(#shadow3b)">
    <rect x="0" y="0" width="310" height="48" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="26" cy="24" r="12" fill="#10b981"/>
    <path d="M20 24 L24 28 L32 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Linux environment installed successfully!</text>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
