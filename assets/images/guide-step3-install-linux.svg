<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg3)" stroke="#1e293b" stroke-width="4" filter="url(#shadow3)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#080c14"/>

  <!-- Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:10</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- Background dim layer for modal dialogs -->
  <rect x="16" y="54" width="348" height="612" fill="#000000" opacity="0.65"/>

  <!-- CARD 1: CONFIRMATION ALERT DIALOG -->
  <g transform="translate(30, 80)" filter="url(#shadow3)">
    <rect x="0" y="0" width="320" height="230" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Dialog Title -->
    <text x="24" y="36" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">⚡ Install Termux Linux</text>
    
    <!-- Dialog Description -->
    <text x="24" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500">Install embedded Linux package system (~31 MB)?</text>
    
    <text x="24" y="96" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Installs bash, apt &amp; pkg package manager</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Offline compilers: Clang, Python, Node.js</text>
    <text x="24" y="140" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• 100% rootless inside app environment</text>

    <!-- Dialog Action Buttons -->
    <text x="140" y="196" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Cancel</text>
    
    <rect x="200" y="172" width="102" height="38" rx="8" fill="#4f46e5"/>
    <text x="215" y="196" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Install Now</text>
  </g>

  <!-- RED ARROW POINTING TO "Install Now" -->
  <g filter="url(#glowRed3)">
    <path d="M260 250 L260 216" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <polygon points="255,218 265,218 260,210" fill="#f43f5e"/>
    
    <rect x="150" y="250" width="165" height="30" rx="6" fill="#f43f5e"/>
    <text x="160" y="270" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">TAP "INSTALL NOW"</text>
  </g>

  <!-- CARD 2: INSTALLATION IN PROGRESS DIALOG -->
  <g transform="translate(30, 340)" filter="url(#shadow3)">
    <rect x="0" y="0" width="320" height="170" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <text x="24" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Installing Termux Linux...</text>
    
    <text x="24" y="68" fill="#38bdf8" font-family="monospace" font-size="12.5" font-weight="600">Extracting bootstrap rootfs (78%)...</text>

    <!-- Horizontal Progress Bar Track -->
    <rect x="24" y="85" width="272" height="10" rx="5" fill="#0f172a"/>
    <!-- Progress Bar Fill (78%) -->
    <rect x="24" y="85" width="212" height="10" rx="5" fill="url(#progGrad)"/>

    <text x="24" y="125" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Automated one-time setup • Takes ~15 seconds</text>
    <text x="250" y="125" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">78%</text>
  </g>

  <!-- SUCCESS TOAST MESSAGE -->
  <g transform="translate(45, 545)" filter="url(#shadow3)">
    <rect x="0" y="0" width="290" height="46" rx="23" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="24" cy="23" r="10" fill="#10b981"/>
    <path d="M19 23 L22 26 L29 19" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Linux installed successfully!</text>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
