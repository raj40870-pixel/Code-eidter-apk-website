<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg5)" stroke="#1e293b" stroke-width="4" filter="url(#shadow5)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#080c14"/>

  <!-- Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:12</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- App Header / Action Bar -->
  <rect x="16" y="54" width="348" height="52" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Hamburger/Folder -->
  <rect x="26" y="65" width="28" height="28" rx="6" fill="#1e293b"/>
  <line x1="32" y1="74" x2="48" y2="74" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="79" x2="48" y2="79" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="84" x2="48" y2="84" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <text x="62" y="84" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="700">Code Editor</text>

  <!-- Top Action Buttons -->
  <text x="175" y="84" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PASTE</text>
  <text x="225" y="84" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">&gt;_TERM</text>

  <!-- RUN BUTTON (CLICK TARGET) -->
  <rect id="run-btn" x="275" y="64" width="52" height="32" rx="8" fill="#10b981" filter="url(#shadow5)"/>
  <polygon points="286,72 286,88 298,80" fill="#ffffff"/>
  <text x="303" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">RUN</text>

  <!-- Save icon -->
  <rect x="334" y="68" width="20" height="24" rx="3" fill="#1e293b"/>
  <path d="M338 72 L348 72 L351 75 L351 88 L338 88 Z" fill="#94a3b8"/>

  <!-- Multi-Tab Bar -->
  <rect x="16" y="106" width="348" height="38" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Tab 1 (Active): main.cpp -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="105" height="34" rx="6" fill="#1e293b"/>
    <circle cx="12" cy="17" r="5" fill="#2563eb"/>
    <text x="10" y="20" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">C</text>
    <text x="24" y="21" fill="#f8fafc" font-family="monospace" font-size="11.5" font-weight="600">main.cpp</text>
    <text x="92" y="20" fill="#64748b" font-family="sans-serif" font-size="11">×</text>
  </g>

  <!-- Tab 2: main.rs -->
  <g transform="translate(130, 110)">
    <rect x="0" y="0" width="95" height="34" rx="6" fill="transparent"/>
    <circle cx="12" cy="17" r="5" fill="#ea580c"/>
    <text x="9" y="20" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">R</text>
    <text x="24" y="21" fill="#64748b" font-family="monospace" font-size="11.5">main.rs</text>
  </g>

  <!-- Tab 3: index.html -->
  <g transform="translate(230, 110)">
    <rect x="0" y="0" width="100" height="34" rx="6" fill="transparent"/>
    <circle cx="12" cy="17" r="5" fill="#f97316"/>
    <text x="9" y="20" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">5</text>
    <text x="24" y="21" fill="#64748b" font-family="monospace" font-size="11.5">index.html</text>
  </g>

  <!-- Code Editor Body -->
  <rect x="16" y="144" width="348" height="390" fill="#0d111a"/>
  
  <!-- Line Numbers & Code with Syntax Highlighting -->
  <g transform="translate(24, 160)" font-family="monospace" font-size="12" line-height="22">
    <!-- Line 1 -->
    <text x="0" y="16" fill="#475569"> 1</text>
    <text x="26" y="16" fill="#ec4899">#include</text>
    <text x="86" y="16" fill="#a5b4fc">&lt;iostream&gt;</text>

    <!-- Line 2 -->
    <text x="0" y="38" fill="#475569"> 2</text>
    <text x="26" y="38" fill="#818cf8">using namespace</text>
    <text x="136" y="38" fill="#f8fafc">std;</text>

    <!-- Line 3 -->
    <text x="0" y="60" fill="#475569"> 3</text>

    <!-- Line 4 -->
    <text x="0" y="82" fill="#475569"> 4</text>
    <text x="26" y="82" fill="#38bdf8">int</text>
    <text x="54" y="82" fill="#facc15">main</text>
    <text x="82" y="82" fill="#f8fafc">() {</text>

    <!-- Line 5 -->
    <text x="0" y="104" fill="#475569"> 5</text>
    <text x="44" y="104" fill="#38bdf8">int</text>
    <text x="72" y="104" fill="#f8fafc">a, b;</text>

    <!-- Line 6 -->
    <text x="0" y="126" fill="#475569"> 6</text>
    <text x="44" y="126" fill="#f8fafc">cout &lt;&lt;</text>
    <text x="100" y="126" fill="#34d399">"Pehla number dal: "</text>
    <text x="250" y="126" fill="#f8fafc">;</text>

    <!-- Line 7 -->
    <text x="0" y="148" fill="#475569"> 7</text>
    <text x="44" y="148" fill="#f8fafc">cin &gt;&gt; a;</text>

    <!-- Line 8 -->
    <text x="0" y="170" fill="#475569"> 8</text>
    <text x="44" y="170" fill="#f8fafc">cout &lt;&lt;</text>
    <text x="100" y="170" fill="#34d399">"Dusra number dal: "</text>
    <text x="250" y="170" fill="#f8fafc">;</text>

    <!-- Line 9 -->
    <text x="0" y="192" fill="#475569"> 9</text>
    <text x="44" y="192" fill="#f8fafc">cin &gt;&gt; b;</text>

    <!-- Line 10 -->
    <text x="0" y="214" fill="#475569">10</text>
    <text x="44" y="214" fill="#f8fafc">cout &lt;&lt;</text>
    <text x="100" y="214" fill="#34d399">"Jod = "</text>
    <text x="160" y="214" fill="#f8fafc">&lt;&lt; a + b &lt;&lt; endl;</text>

    <!-- Line 11 -->
    <text x="0" y="236" fill="#475569">11</text>
    <text x="44" y="236" fill="#ec4899">return</text>
    <text x="92" y="236" fill="#38bdf8">0</text>
    <text x="102" y="236" fill="#f8fafc">;</text>

    <!-- Line 12 -->
    <text x="0" y="258" fill="#475569">12</text>
    <text x="26" y="258" fill="#f8fafc">}</text>
  </g>

  <!-- SMART MOBILE CODING KEYBOARD BAR -->
  <rect x="16" y="534" width="348" height="42" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(24, 545)" font-family="monospace" font-size="11" fill="#93c5fd" font-weight="600">
    <text x="0" y="17">include</text>
    <text x="56" y="17">class</text>
    <text x="100" y="17">struct</text>
    <text x="152" y="17">public</text>
    <text x="202" y="17">int</text>
    <text x="236" y="17">Tab</text>
    <text x="270" y="17">{}</text>
    <text x="296" y="17">()</text>
    <text x="320" y="17">;</text>
  </g>

  <!-- RED ARROW POINTING TO "RUN" BUTTON -->
  <g filter="url(#glowRed5)">
    <!-- Pulsing target around RUN button -->
    <circle cx="301" cy="80" r="22" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,3"/>
    
    <!-- Red Pointer Arrow -->
    <path d="M210 35 L280 68" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <polygon points="280,60 286,72 274,70" fill="#f43f5e"/>

    <!-- Callout Banner -->
    <rect x="35" y="15" width="200" height="38" rx="8" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="45" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">STEP 4: HIT RUN (▶)</text>
    <text x="45" y="45" fill="#ffe4e6" font-family="-apple-system, sans-serif" font-size="10">Auto-saves &amp; compiles native code</text>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
