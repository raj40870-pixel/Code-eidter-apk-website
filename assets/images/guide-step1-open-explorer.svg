<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="redArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Phone Outer Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg)" stroke="#1e293b" stroke-width="4" filter="url(#shadow)"/>
  <!-- Screen Area -->
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#0d111a"/>

  <!-- Android Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:09</text>
  <circle cx="310" cy="38" r="3" fill="#94a3b8"/>
  <circle cx="320" cy="38" r="3" fill="#94a3b8"/>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- App Header / Toolbar -->
  <rect x="16" y="54" width="348" height="52" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Folder / Menu Button (Step 1 Click Target) -->
  <rect id="menu-btn" x="26" y="64" width="34" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <path d="M33 75 L39 71 L45 75 L53 75 C54 75 55 76 55 77 L55 85 C55 86 54 87 53 87 L33 87 C32 87 31 86 31 85 L31 77 C31 76 32 75 33 75 Z" fill="#60a5fa"/>

  <text x="70" y="85" fill="#f8fafc" font-family="-apple-system, Roboto, sans-serif" font-size="15" font-weight="700">Code Editor</text>
  
  <!-- Top Right Toolbar Icons -->
  <rect x="250" y="65" width="48" height="30" rx="6" fill="#1e293b"/>
  <text x="258" y="85" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">&gt;_ TERM</text>

  <rect x="306" y="65" width="46" height="30" rx="6" fill="#10b981"/>
  <polygon points="317,73 317,87 328,80" fill="#ffffff"/>
  <text x="331" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">RUN</text>

  <!-- Left Sliding Explorer Drawer (Open) -->
  <rect x="16" y="106" width="280" height="560" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Explorer Header -->
  <rect x="16" y="106" width="280" height="44" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="133" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">EXPLORER</text>
  
  <!-- Search, Add File, Three-Dots Icons -->
  <circle cx="210" cy="128" r="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="214" y1="132" x2="219" y2="137" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Plus icon -->
  <rect x="232" y="117" width="22" height="22" rx="4" fill="#1e293b"/>
  <text x="238" y="133" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">+</text>

  <!-- Three dots icon -->
  <circle cx="274" cy="124" r="2" fill="#94a3b8"/>
  <circle cx="274" cy="128" r="2" fill="#94a3b8"/>
  <circle cx="274" cy="132" r="2" fill="#94a3b8"/>

  <!-- Project Section -->
  <text x="32" y="172" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CPPSTARTER</text>

  <!-- File 1: main.cpp -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="250" height="34" rx="6" fill="#1e293b" opacity="0.6"/>
    <rect x="6" y="8" width="18" height="18" rx="4" fill="#2563eb"/>
    <text x="10" y="21" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">C</text>
    <text x="32" y="22" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">main.cpp</text>
  </g>

  <!-- File 2: index.html -->
  <g transform="translate(30, 226)">
    <rect x="6" y="8" width="18" height="18" rx="4" fill="#ea580c"/>
    <text x="10" y="21" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">5</text>
    <text x="32" y="22" fill="#94a3b8" font-family="monospace" font-size="13">index.html</text>
  </g>

  <!-- File 3: main.rs -->
  <g transform="translate(30, 266)">
    <rect x="6" y="8" width="18" height="18" rx="4" fill="#b45309"/>
    <text x="11" y="21" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">R</text>
    <text x="32" y="22" fill="#94a3b8" font-family="monospace" font-size="13">main.rs</text>
  </g>

  <!-- File 4: server.js -->
  <g transform="translate(30, 306)">
    <rect x="6" y="8" width="18" height="18" rx="4" fill="#ca8a04"/>
    <text x="8" y="21" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">JS</text>
    <text x="32" y="22" fill="#94a3b8" font-family="monospace" font-size="13">server.js</text>
  </g>

  <!-- RED ANNOTATION ARROW 1: Pointing to Folder Drawer Icon -->
  <g filter="url(#glowRed)">
    <!-- Pulsing target circle -->
    <circle cx="43" cy="80" r="18" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="43" cy="80" r="6" fill="#f43f5e"/>

    <!-- Pointer arrow curving to callout -->
    <path d="M43 98 Q50 140 100 145" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <polygon points="41,92 48,102 38,102" fill="#f43f5e"/>

    <!-- Callout Box -->
    <rect x="95" y="125" width="220" height="42" rx="10" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="108" y="143" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">STEP 1: TAP FOLDER ICON</text>
    <text x="108" y="157" fill="#ffe4e6" font-family="-apple-system, sans-serif" font-size="10.5">Slides open project files &amp; menu</text>
  </g>

  <!-- Bottom Android Navigation Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
