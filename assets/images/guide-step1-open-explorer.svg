<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowRed1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff0055" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="url(#phoneBg1)" stroke="#1e293b" stroke-width="4" filter="url(#shadow1)"/>
  <rect x="16" y="16" width="348" height="688" rx="30" fill="#0d111a"/>

  <!-- Android Status Bar -->
  <text x="36" y="42" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">11:09</text>
  <rect x="330" y="32" width="18" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="332" y="34" width="12" height="7" rx="1" fill="#10b981"/>

  <!-- Top Action Bar (Main App Header) -->
  <rect x="16" y="54" width="348" height="54" fill="#131b2e" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- THREE LINES (≡) MENU BUTTON (CLICK TARGET 1) -->
  <rect x="24" y="64" width="36" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <line x1="32" y1="73" x2="52" y2="73" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="81" x2="52" y2="81" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="89" x2="52" y2="89" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- App Title -->
  <text x="68" y="86" fill="#f8fafc" font-family="-apple-system, Roboto, sans-serif" font-size="14.5" font-weight="800">Code Editor - C++</text>
  
  <!-- Top Right Toolbar Icons -->
  <text x="210" y="86" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PASTE</text>
  <rect x="254" y="66" width="46" height="30" rx="6" fill="#1e293b"/>
  <text x="261" y="86" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="700">&gt;_TERM</text>
  
  <rect x="306" y="66" width="48" height="30" rx="6" fill="#10b981"/>
  <polygon points="316,73 316,89 328,81" fill="#ffffff"/>
  <text x="331" y="86" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800">RUN</text>

  <!-- Left Sliding Explorer Drawer (Opening from Three Lines Click) -->
  <rect x="16" y="108" width="285" height="558" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow1)"/>
  
  <!-- Explorer Header -->
  <rect x="16" y="108" width="285" height="46" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="137" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">EXPLORER</text>
  
  <!-- Explorer action icons: Search, Add, Three-Dots -->
  <circle cx="215" cy="131" r="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="219" y1="135" x2="224" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="242" y="137" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">+</text>
  
  <!-- Three dots icon -->
  <circle cx="278" cy="126" r="2.5" fill="#cbd5e1"/>
  <circle cx="278" cy="131" r="2.5" fill="#cbd5e1"/>
  <circle cx="278" cy="136" r="2.5" fill="#cbd5e1"/>

  <!-- Project Section -->
  <text x="32" y="180" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CPPSTARTER (PROJECT ROOT)</text>

  <!-- File 1: main.cpp -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="255" height="36" rx="8" fill="#1e293b"/>
    <rect x="8" y="9" width="18" height="18" rx="4" fill="#2563eb"/>
    <text x="12" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">C</text>
    <text x="34" y="23" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">main.cpp</text>
  </g>

  <!-- File 2: index.html -->
  <g transform="translate(30, 238)">
    <rect x="8" y="9" width="18" height="18" rx="4" fill="#ea580c"/>
    <text x="12" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">5</text>
    <text x="34" y="23" fill="#94a3b8" font-family="monospace" font-size="13">index.html</text>
  </g>

  <!-- File 3: main.rs -->
  <g transform="translate(30, 278)">
    <rect x="8" y="9" width="18" height="18" rx="4" fill="#b45309"/>
    <text x="13" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">R</text>
    <text x="34" y="23" fill="#94a3b8" font-family="monospace" font-size="13">main.rs</text>
  </g>

  <!-- File 4: server.js -->
  <g transform="translate(30, 318)">
    <rect x="8" y="9" width="18" height="18" rx="4" fill="#ca8a04"/>
    <text x="10" y="22" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">JS</text>
    <text x="34" y="23" fill="#94a3b8" font-family="monospace" font-size="13">server.js</text>
  </g>

  <!-- BOLD RED POINTER ARROW POINTING TO THREE LINES (≡) -->
  <g filter="url(#glowRed1)">
    <!-- Pulsing target circle around ≡ -->
    <circle cx="42" cy="81" r="22" fill="none" stroke="#ff0055" stroke-width="3" stroke-dasharray="5,4"/>
    <circle cx="42" cy="81" r="7" fill="#ff0055"/>

    <!-- Sharp Arrow curving to callout -->
    <path d="M42 105 L42 145" fill="none" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>
    <polygon points="36,108 48,108 42,97" fill="#ff0055"/>

    <!-- Callout Box: STEP 1 -->
    <rect x="30" y="145" width="280" height="54" rx="12" fill="#ff0055" stroke="#ffffff" stroke-width="2"/>
    <text x="44" y="168" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">STEP 1: TAP THREE LINES (≡) MENU</text>
    <text x="44" y="186" fill="#ffe4e6" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Opens Left Explorer Drawer &amp; Projects</text>
  </g>

  <!-- Bottom Android Nav Bar -->
  <rect x="16" y="666" width="348" height="38" fill="#090d16"/>
  <rect x="100" y="682" width="14" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="190" cy="689" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,689 285,682 285,696" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>
